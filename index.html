<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Studio Meent</title>
  <meta name="description" content="Studio Meent is een ontwerpstudio voor architectuur, stedenbouw, strategie en onderzoek.">

  <!-- Font: Work Sans (Google Fonts). Change here and in base/style.css (--font). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700;900&display=swap">

  <!-- ?v=… makes browsers load the newest version; change the date when the base changes -->
  <link rel="stylesheet" href="base/style.css?v=2026-10-01i">
</head>
<body>
  <div class="page">
    <header class="masthead">
      <a class="logo" href="#works" aria-label="Studio Meent, home">
        <span class="logo-studio">Studio</span>
        <span class="logo-meent">MEENT</span>
      </a>

      <nav class="tabs" aria-label="Hoofdmenu">
        <a class="tab" href="#works" data-tab="works">Werk</a>
        <a class="tab" href="#news" data-tab="news">Nieuws</a>
        <a class="tab" href="#about" data-tab="about">Over ons</a>
        <a class="tab" href="#contact" data-tab="contact">Contact</a>
      </nav>
    </header>

    <main id="view" aria-live="polite"></main>
  </div>

  <!-- Site texts (news, about, contact, filter words): content.js
       List of projects: projects/projects.js (made automatically by build.js — don't edit by hand) -->
  <script>
    // Always load the newest texts and project list (no old saved copies).
    var t = Date.now();
    document.write('<script src="content.js?t=' + t + '"><\/script>');
    document.write('<script src="projects/projects.js?t=' + t + '"><\/script>');
  </script>
  <script src="base/app.js?v=2026-10-01i"></script>
</body>
</html>
