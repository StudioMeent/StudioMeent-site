<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- ================================================================
     PROJECT TEMPLATE — Studio Meent
     1. Copy this whole _template folder into /projects and rename it,
        e.g. /projects/my-project  (lowercase, hyphens, no spaces).
     2. Fill in info.json and replace thumbnail.jpg.
     3. Either use this simple slideshow page (edit the PROJECT block
        below), or replace everything in this file with your own design.
        The ONLY line that must stay is the back-button script.
     4. Run: node build.js   → the project appears in the Works grid.
     ================================================================ -->

<title>Project title — Studio Meent</title>
<meta name="description" content="One sentence about the project.">

<!-- REQUIRED: the Studio Meent back button. Keep this line in every project.
     Optional: data-position="bottom-left" | "bottom-right" | "top-left" | "top-right" -->
<script src="../../base/back-button.js" data-position="bottom-left" defer></script>

<!-- Optional: Studio Meent reset/utilities (box-sizing, safe areas, focus, reduced motion).
     Remove if it conflicts with your design. -->
<link rel="stylesheet" href="../../base/reset.css">

<!-- Everything below is this project's own design. Change freely. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
  :root {
    color-scheme: light;
    --red: #dc1846; --on-red: #ffffff; --ink: #161616;
    --grotesk: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --serif: "Source Serif 4", Georgia, serif;
    --step: 4px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--red); color: var(--on-red); font-family: var(--grotesk); }
  main { max-width: 420px; margin: 0 auto; padding: 72px 20px 110px; }
  .stack { position: relative; margin-top: calc(var(--step) * 12); }
  .stack .layer {
    position: absolute; inset: 0; border: 2px solid var(--on-red); background: var(--red);
    transform: translate(calc(var(--i) * var(--step)), calc(var(--i) * var(--step) * -1));
    animation: fan .7s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i) * 25ms);
  }
  @keyframes fan { from { transform: translate(0, 0); } }
  .frame { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: var(--ink); cursor: pointer; outline: 2px solid var(--on-red); }
  .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .25s; }
  .frame img.out { opacity: 0; }
  .count { display: block; margin-top: 10px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  h1 { font-size: 15px; font-weight: 600; margin: 14px 0 6px; letter-spacing: .01em; }
  .prose { font-family: var(--serif); font-size: 15.5px; line-height: 1.3; text-align: justify; hyphens: auto; }
  .prose p { margin: 0; }
  :focus-visible { outline: 3px solid var(--on-red); outline-offset: 2px; }
  @media (max-width: 760px) { :root { --step: 3px; } main { padding: 32px 16px 100px; padding-right: calc(16px + var(--step) * 12); } }
  @media (prefers-reduced-motion: reduce) { .stack .layer { animation: none; } .frame img { transition: none; } }
</style>
</head>
<body>
<main>
  <div class="stack" id="stack">
    <div class="frame" role="button" tabindex="0" aria-label="Next image"><img id="img" src="" alt=""></div>
  </div>
  <span class="count" id="count"></span>
  <h1 id="heading"></h1>
  <div class="prose" id="text"></div>
</main>

<script>
  /* ---------------- PROJECT: edit this block ---------------- */
  const PROJECT = {
    heading: "Project title — Research, Rotterdam 2026",
    images: [            // files in this folder's images/ folder, in order
      "images/01.jpg",
      "images/02.jpg",
    ],
    text: [              // one entry per paragraph
      "First paragraph: what the project is, where it took place and who it was made with.",
      "Second paragraph: the method, the result and the credits.",
    ],
  };
  /* ----------------------------------------------------------- */

  const pad = n => String(n).padStart(2, "0");
  const img = document.getElementById("img"), count = document.getElementById("count");
  document.getElementById("heading").textContent = PROJECT.heading;
  document.getElementById("text").innerHTML = PROJECT.text.map(t => `<p>${t}</p>`).join("");
  const stack = document.getElementById("stack");
  for (let i = 1; i <= 12; i++) stack.insertAdjacentHTML("afterbegin", `<span class="layer" style="--i:${i}"></span>`);
  let slide = 0;
  const show = () => { img.src = PROJECT.images[slide]; img.alt = `${PROJECT.heading}, image ${slide + 1}`; count.textContent = `${pad(slide + 1)}/${pad(PROJECT.images.length)}`; };
  const next = dir => {
    slide = (slide + dir + PROJECT.images.length) % PROJECT.images.length;
    img.classList.add("out"); setTimeout(() => { show(); img.classList.remove("out"); }, 180);
  };
  const frame = document.querySelector(".frame");
  frame.addEventListener("click", () => next(1));
  frame.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); next(1); } });
  document.addEventListener("keydown", e => { if (e.key === "ArrowRight") next(1); if (e.key === "ArrowLeft") next(-1); });
  show();
</script>
</body>
</html>
